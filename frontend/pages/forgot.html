<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar Senha - Barbearia Agendamento</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <header class="bg-primary text-white text-center py-4">
    <h1>Recuperar Senha</h1>
  </header>

  <main class="container my-4">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-4">
        <div class="border p-4 rounded mb-4">
          <form id="forgot-form">
            <div class="mb-3">
              <label for="forgot-email" class="form-label">E-mail</label>
              <input type="email" class="form-control" id="forgot-email" required>
            </div>
            <div class="d-grid">
              <button type="submit" class="btn btn-primary">Enviar link de recuperação</button>
            </div>
          </form>
          <div id="forgot-message" class="mt-3"></div>
          <div class="text-center mt-3">
            <a href="login.html">Voltar ao login</a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="bg-dark text-white text-center py-3">
    <p>&copy; 2026 Barbearia Agendamento. Todos os direitos reservados.</p>
  </footer>

  <script src="../assets/js/api.js" type="module"></script>
  <script type="module">
    import { api } from '../assets/js/api.js';

    const form = document.getElementById('forgot-form');
    const messageDiv = document.getElementById('forgot-message');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('forgot-email').value.trim();

      try {
        const data = await api.post('/auth/esqueci-senha', { email });
        // In dev, the API returns a dev_token
        messageDiv.innerHTML = `
          <p class="alert alert-success">Se o e-mail existir, um link de recuperação foi gerado.</p>
          ${data.dev_token ? `<p class="monospace"><strong>Token de desenvolvimento:</strong> ${data.dev_token}</p>` : ''}
          ${data.dev_token ? `<p>Use este token na página de redefinição de senha.</p>` : ''}
          ${data.dev_token ? `<p><a href="reset.html?token=${data.dev_token}">Ir para redefinição de senha</a></p>` : ''}
        `;
      } catch (err) {
        console.error('Erro ao solicitar recuperação de senha:', err);
        messageDiv.innerHTML = `<p class="alert alert-danger">Erro: ${err.message}</p>`;
      }
    });
  </script>
</body>
</html>
