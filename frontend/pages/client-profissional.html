<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selecionar Profissional - Barbearia Agendamento</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <header class="bg-primary text-white text-center py-3">
    <div class="container d-flex justify-content-between align-items-center">
      <a href="client-services.html" class="text-white text-decoration-none">← Voltar</a>
      <h2>Selecionar Profissional</h2>
      <a href="client-dashboard.html" class="text-white text-decoration-none">Dashboard</a>
    </div>
  </header>

  <main class="container my-4">
    <div id="profissional-content">
      <p class="text-center">Carregando profissionais...</p>
    </div>
  </main>

  <footer class="bg-dark text-white text-center py-3">
    <p>&copy; 2026 Barbearia Agendamento. Todos os direitos reservados.</p>
  </footer>

  <script src="../assets/js/api.js" type="module"></script>
  <script type="module">
    import { api } from '../assets/js/api.js';

    // Get service_id from query string
    const urlParams = new URLSearchParams(window.location.search);
    const serviceId = urlParams.get('service_id');
    if (!serviceId) {
      window.location.href = 'client-services.html';
    }

    async function loadProfessionals() {
      try {
        const data = await api.get(`/barbeiro-servico/servico/${serviceId}/barbeiros`);
        const container = document.getElementById('profissional-content');
        if (!data || data.length === 0) {
          container.innerHTML = '<p class="text-center">Nenhum profissional encontrado para este serviço.</p>';
          return;
        }
        // We need to get the barbeiro details (name) for each barbeiro_id
        // For now, we'll assume the response includes barbeiro object with nome
        // If not, we may need to make additional requests.
        let html = '';
        for (const item of data) {
          // Assuming item.barbeiro is populated with nome
          const barbeiroNome = item.barbeiro ? item.barbeiro.nome : `Profissional #${item.barbeiro_id}`;
          html += `
            <div class="col-md-4 mb-4">
              <div class="card h-100 border shadow-sm">
                <div class="card-body d-flex flex-column">
                  <h5 class="card-title">${barbeiroNome}</h5>
                  <a href="client-date.html?service_id=${serviceId}&barbeiro_id=${item.barbeiro_id}" class="btn btn-primary mt-auto">Selecionar</a>
                </div>
              </div>
            </div>
          `;
        }
        container.innerHTML = `<div class="row g-4">${html}</div>`;
      } catch (err) {
        console.error('Erro ao carregar profissionais:', err);
        if (err.message.includes('401')) {
          // Token missing or invalid, redirect to login
          window.location.href = 'login.html';
        } else if (err.message.includes('403')) {
          document.getElementById('profissional-content').innerHTML = `
            <p class="text-center text-danger">Erro de permissão ao carregar profissionais.</p>
            <p class="text-center">Verifique se o backend permite que clientes listem profissionais para um serviço.</p>
          `;
        } else {
          document.getElementById('profissional-content').innerHTML = `<p class="text-center text-danger">Erro ao carregar profissionais.</p>`;
        }
      }
    }

    // Load data on page load
    loadProfessionals();
  </script>
</body>
</html>
