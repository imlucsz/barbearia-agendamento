<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#15120f">
  <title>Nova senha | Barbearia</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <header class="site-header"><div class="container header-inner"><a class="brand-lockup" href="index.html"><span class="brand-mark">B.</span><span class="brand-copy"><strong>Barbearia</strong><small>ESTILO COM ATITUDE</small></span></a><a class="btn btn-ghost" href="login.html">Voltar ao login</a></div></header>
  <main class="page-shell">
    <div class="page-heading"><span class="eyebrow">RECUPERAÇÃO DE ACESSO</span><h1>Escolha uma<br><em>nova senha.</em></h1><p>Use pelo menos 6 caracteres e mantenha sua conta protegida.</p></div>
    <section class="card">
      <div id="form-message" class="alert" role="alert" tabindex="-1" hidden></div>
      <form id="reset-form" class="form-grid">
        <div class="form-field form-field--full"><label class="form-label" for="reset-password">Nova senha</label><input id="reset-password" name="senha" type="password" autocomplete="new-password" minlength="6" required></div>
        <div class="form-field form-field--full"><button class="btn w-100" type="submit">Salvar nova senha</button></div>
      </form>
    </section>
  </main>
  <footer class="auth-footer"><p>© <span id="current-year"></span> Barbearia Agendamento</p></footer>
  <script type="module" src="../assets/js/auth.js"></script>
</body>
</html>
