<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redefinir Senha - Barbearia Agendamento</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <header class="bg-primary text-white text-center py-4">
    <h1>Redefinir Senha</h1>
  </header>

  <main class="container my-4">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-4">
        <div class="border p-4 rounded mb-4">
          <form id="reset-form">
            <input type="hidden" id="reset-token">
            <div class="mb-3">
              <label for="reset-nova-senha" class="form-label">Nova Senha</label>
              <input type="password" class="form-control" id="reset-nova-senha" required>
            </div>
            <div class="mb-3">
              <label for="reset-confirm-senha" class="form-label">Confirmar Nova Senha</label>
              <input type="password" class="form-control" id="reset-confirm-senha" required>
            </div>
            <div class="d-grid">
              <button type="submit" class="btn btn-primary">Redefinir Senha</button>
            </div>
          </form>
          <div id="reset-message" class="mt-3"></div>
          <div class="text-center mt-3">
            <a href="login.html">Voltar ao login</a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="bg-dark text-white text-center py-3">
    <p>&copy; 2026 Barbearia Agendamento. Todos os direitos reservados.</p>
  </footer>

  <script src="../assets/js/api.js" type="module"></script>
  <script type="module">
    import { api } from '../assets/js/api.js';

    // Extract token from query string
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    if (!token) {
      alert('Token não fornecido');
      window.location.href = 'login.html';
    }
    document.getElementById('reset-token').value = token;

    const form = document.getElementById('reset-form');
    const messageDiv = document.getElementById('reset-message');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const novaSenha = document.getElementById('reset-nova-senha').value;
      const confirmSenha = document.getElementById('reset-confirm-senha').value;

      if (novaSenha !== confirmSenha) {
        messageDiv.innerHTML = '<p class="alert alert-danger">As senhas não coincidem.</p>';
        return;
      }

      try {
        const data = await api.post('/auth/redefinir-senha', { token, nova_senha: novaSenha });
        messageDiv.innerHTML = '<p class="alert alert-success">Senha redefinida com sucesso! Você pode fazer login agora.</p>';
        // Optionally, auto-login after reset? We'll just show success.
        form.reset();
      } catch (err) {
        console.error('Erro ao redefinir senha:', err);
        messageDiv.innerHTML = `<p class="alert alert-danger">Erro: ${err.message}</p>`;
      }
    });
  </script>
</body>
</html>
