<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - Barbearia Agendamento</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <header class="bg-primary text-white text-center py-4">
    <h1>Cadastro</h1>
  </header>

  <main class="container my-4">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-4">
        <div class="border p-4 rounded mb-4">
          <form id="register-form">
            <div class="mb-3">
              <label for="register-nome" class="form-label">Nome completo</label>
              <input type="text" class="form-control" id="register-nome" required>
            </div>
            <div class="mb-3">
              <label for="register-email" class="form-label">E-mail</label>
              <input type="email" class="form-control" id="register-email" required>
            </div>
            <div class="mb-3">
              <label for="register-senha" class="form-label">Senha</label>
              <input type="password" class="form-control" id="register-senha" required>
            </div>
            <div class="d-grid">
              <button type="submit" class="btn btn-primary">Cadastrar</button>
            </div>
          </form>
          <div class="text-center mt-3">
            <p>Já tem uma conta? <a href="login.html">Faça login</a></p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="bg-dark text-white text-center py-3">
    <p>&copy; 2026 Barbearia Agendamento. Todos os direitos reservados.</p>
  </footer>

  <script src="../assets/js/api.js" type="module"></script>
  <script type="module">
    import { api } from '../assets/js/api.js';

    const form = document.getElementById('register-form');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const nome = document.getElementById('register-nome').value.trim();
      const email = document.getElementById('register-email').value.trim();
      const senha = document.getElementById('register-senha').value;

      try {
        const data = await api.post('/auth/register', { nome, email, senha });
        alert('Cadastro realizado com sucesso! Você pode fazer login agora.');
        window.location.href = 'login.html';
      } catch (err) {
        console.error('Erro ao cadastrar:', err);
        alert(`Erro: ${err.message}`);
      }
    });
  </script>
</body>
</html>
