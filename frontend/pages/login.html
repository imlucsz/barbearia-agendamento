<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Barbearia Agendamento</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <header class="bg-primary text-white text-center py-4">
    <h1>Login</h1>
  </header>

  <main class="container my-4">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-4">
        <div class="border p-4 rounded mb-4">
          <form id="login-form">
            <div class="mb-3">
              <label for="login-email" class="form-label">E-mail</label>
              <input type="email" class="form-control" id="login-email" required>
            </div>
            <div class="mb-3">
              <label for="login-senha" class="form-label">Senha</label>
              <input type="password" class="form-control" id="login-senha" required>
            </div>
            <div class="d-grid">
              <button type="submit" class="btn btn-primary">Entrar</button>
            </div>
          </form>
          <div class="text-center mt-3">
            <p>Não tem uma conta? <a href="cadastro.html">Cadastre-se</a></p>
            <p><a href="forgot.html">Esqueci minha senha</a></p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="bg-dark text-white text-center py-3">
    <p>&copy; 2026 Barbearia Agendamento. Todos os direitos reservados.</p>
  </footer>

  <script src="../assets/js/api.js" type="module"></script>
  <script type="module">
    import { api, setToken } from '../assets/js/api.js';

    const form = document.getElementById('login-form');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const senha = document.getElementById('login-senha').value;

      try {
        const data = await api.post('/auth/login', { email, senha });
        // Assume the response includes user and access_token
        if (data.access_token) {
          setToken(data.access_token);
          // Redirect to appropriate page based on role? For now, go to client area
          window.location.href = 'client.html'; // We'll create client area later
        } else {
          alert('Login falhou: token não recebido');
        }
      } catch (err) {
        console.error('Erro ao fazer login:', err);
        alert(`Erro: ${err.message}`);
      }
    });
  </script>
</body>
</html>
