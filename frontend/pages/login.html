<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#15120f">
  <title>Entrar | Barbearia</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/product-editorial.css">
</head>
<body class="product-editorial auth-editorial">
  <a class="product-skip-link" href="#main-content">Pular para o conteúdo</a>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand-lockup" href="index.html"><span class="brand-mark">B.</span><span class="brand-copy"><strong>Barbearia</strong><small>ESTILO COM ATITUDE</small></span></a>
      <a class="btn btn-ghost" href="index.html">Voltar ao início</a>
    </div>
  </header>
  <main id="main-content" tabindex="-1" class="page-shell">
    <div class="page-heading"><span class="eyebrow">BEM-VINDO DE VOLTA</span><h1>Entre e escolha<br><em>seu horário.</em></h1><p>Acesse sua conta para acompanhar seus agendamentos.</p></div>
    <section class="card" aria-labelledby="login-title">
      <h2 id="login-title" class="form-title">Entrar na conta</h2>
      <div id="form-message" class="alert" role="alert" tabindex="-1" hidden></div>
      <form id="login-form" class="form-grid">
        <div class="form-field form-field--full"><label class="form-label" for="login-email">E-mail</label><input id="login-email" name="email" type="email" autocomplete="email" required></div>
        <div class="form-field form-field--full"><label class="form-label" for="login-password">Senha</label><input id="login-password" name="senha" type="password" autocomplete="current-password" data-password-visibility required></div>
        <div class="form-field form-field--full"><button class="btn w-100" type="submit">Entrar na minha conta</button></div>
      </form>
      <div class="auth-links"><a href="forgot.html">Esqueci minha senha</a><span>Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a></span></div>
    </section>
  </main>
  <footer class="auth-footer"><p>© <span id="current-year"></span> Barbearia Agendamento</p></footer>
  <script type="module" src="../assets/js/auth.js"></script>
  <script type="module" src="../assets/js/password-visibility.mjs"></script>
  <script type="module" src="../assets/js/product-navigation.mjs"></script>
</body>
</html>
