<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../assets/css/client.css">
</head>
<body>
    <div class="login-container">
        <div class="card-header">
            <h2>Entrar na conta</h2>
        </div>

        <form class="login-form">
            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="meuemail@ex.com" required>
            </div>

            <div class="input-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="Digite sua senha" required>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-primary">Entrar</button>
                <a href="#" id="abrir-cadastro" class="btn-register-link">Criar Conta</a>
            </div>
        </form>
    </div>

    <div id="modal-cadastro" class="modal-register">
        <div class="modal-content">
            <div class="card-header">
                <h2>Criar Nova Conta</h2>
            </div>

            <form class="register-form">
                <div class="input-group">
                    <label for="nome-completo">Nome Completo</label>
                    <input type="text" id="nome-completo" placeholder="Seu nome completo" required>
                </div>

                <div class="input-group">
                    <label for="telefone">Número de Telefone/Celular</label>
                    <input type="tel" id="telefone" placeholder="(00) 90000-0000" required>
                </div>

                <div class="input-group">
                    <label for="email-cad">E-mail</label>
                    <input type="email" id="email-cad" placeholder="meuemail@ex.com" required>
                </div>

                <div class="input-group">
                    <label for="senha-cad">Senha</label>
                    <input type="password" id="senha-cad" placeholder="Crie sua senha" required>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-primary">Cadastrar</button>
                    <a href="#" id="fechar-cadastro" class="btn-link">Voltar ao Login</a>
                </div>
            </form>
        </div>
    </div>

    <script src="../assets/js/login.js"></script>
</body>
</html>
