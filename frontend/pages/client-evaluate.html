<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avaliar atendimento | Barbearia</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body data-page="evaluate">
  <header class="site-header"><div class="container header-inner"><a class="brand-lockup" href="index.html"><span class="brand-mark">B.</span><span class="brand-copy"><strong>Barbearia</strong><small>ESTILO COM ATITUDE</small></span></a><a class="btn btn-ghost" href="client-appointments.html">← Agendamentos</a></div></header>
  <main class="page-shell">
    <div class="page-heading"><span class="eyebrow">CONTA PRA GENTE</span><h1>Como foi seu <em>atendimento?</em></h1><p>Sua avaliação ajuda a gente a cuidar cada vez melhor de você.</p></div>
    <section id="evaluate-content" class="card" aria-live="polite"><p>Carregando atendimento…</p></section>
    <form id="evaluate-form" class="card evaluation-form">
      <div id="form-message" class="alert" role="alert" tabindex="-1" hidden></div>
      <div class="form-field"><label class="form-label" for="eval-nota">Sua nota (1 a 5)</label><select id="eval-nota" name="nota" required><option value="">Selecione</option><option value="5">5 — Excelente</option><option value="4">4 — Muito bom</option><option value="3">3 — Bom</option><option value="2">2 — Poderia melhorar</option><option value="1">1 — Não gostei</option></select></div>
      <div class="form-field"><label class="form-label" for="eval-comentario">Comentário (opcional)</label><textarea id="eval-comentario" name="comentario" maxlength="1000" rows="4" placeholder="Conte como foi sua experiência"></textarea></div>
      <button class="btn" type="submit">Enviar avaliação</button>
    </form>
  </main>
  <footer class="auth-footer"><p>© <span id="current-year"></span> Barbearia Agendamento</p></footer>
  <script type="module" src="../assets/js/schedule.js"></script>
</body>
</html>
