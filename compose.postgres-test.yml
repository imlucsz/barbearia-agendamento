services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: barbearia_test
      POSTGRES_USER: barbearia_test
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:?Set a temporary POSTGRES_TEST_PASSWORD first}
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barbearia_test -d barbearia_test"]
      interval: 2s
      timeout: 3s
      retries: 20
