databases:
  - name: barbearia-homolog-db
    databaseName: barbearia_homolog
    user: barbearia_homolog
    postgresMajorVersion: "16"

services:
  - type: web
    name: barbearia-homolog-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python -m alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --no-proxy-headers
    healthCheckPath: /ready
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: barbearia-homolog-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SCHEDULING_TIMEZONE
        value: America/Sao_Paulo
      - key: FORCE_HTTPS
        value: "false"
      - key: CLIENT_IP_SOURCE
        value: cf-connecting-ip
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_TIMEOUT_SECONDS
        value: "10"
      - key: PASSWORD_RESET_URL
        sync: false

  - type: web
    name: barbearia-homolog-frontend
    runtime: static
    rootDir: frontend
    buildCommand: node scripts/build-static.mjs
    staticPublishPath: dist
    routes:
      - type: redirect
        source: /
        destination: /pages/index.html
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "frame-ancestors 'none'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=()"
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=31536000; includeSubDomains"
    envVars:
      - key: PUBLIC_API_URL
        sync: false
