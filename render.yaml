databases:
  - name: barbearia-homolog-db
    databaseName: barbearia_homolog
    user: barbearia_homolog
    postgresMajorVersion: "16"
    plan: free

services:
  - type: web
    name: barbearia-homolog-api
    runtime: python
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: >-
      cd backend &&
      PASSWORD_RESET_URL="${FRONTEND_ORIGIN}/pages/reset.html"
      python -m app.render_start
    plan: free
    healthCheckPath: /ready
    envVars:
      - key: APP_ENV
        value: production
      - key: SERVE_FRONTEND
        value: "true"
      - key: PYTHON_VERSION
        value: 3.14.8
      - key: DATABASE_URL
        fromDatabase:
          name: barbearia-homolog-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        fromService:
          name: barbearia-homolog-api
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: CORS_ALLOWED_ORIGINS
        fromService:
          name: barbearia-homolog-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: FRONTEND_ORIGIN
        fromService:
          name: barbearia-homolog-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: SCHEDULING_TIMEZONE
        value: America/Sao_Paulo
      - key: FORCE_HTTPS
        value: "false"
      - key: CLIENT_IP_SOURCE
        value: cf-connecting-ip
      - key: EMAIL_TRANSPORT
        value: brevo_api
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_TIMEOUT_SECONDS
        value: "10"
      - key: EMAIL_FROM
        sync: false

  - type: web
    name: barbearia-homolog-frontend
    runtime: static
    rootDir: frontend
    buildCommand: node scripts/build-static.mjs
    staticPublishPath: dist
    routes:
      - type: redirect
        source: /
        destination: /pages/index.html
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "frame-ancestors 'none'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=()"
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=31536000; includeSubDomains"
    envVars:
      - key: PUBLIC_SAME_ORIGIN_REDIRECT
        value: "true"
      - key: PUBLIC_API_URL
        fromService:
          name: barbearia-homolog-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
